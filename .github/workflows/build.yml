name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ozyune
        run: |
          set -o pipefail
          xcodebuild \
            -project Ozyune.xcodeproj \
            -scheme Ozyune \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Pins the dsh wire vocabulary the notification pipeline depends on, so a
      # renamed event fails here instead of silently disabling notifications.
      - name: Check signal classifier
        run: bash scripts/check-signal-classifier.sh
